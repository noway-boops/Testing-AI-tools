<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Natural Language to SQL Generator</title>
<style>
    body {
        font-family: Arial, sans-serif;
        margin: 20px;
        background: #f5f5f5;
    }
    h2 {
        margin-top: 30px;
    }
    textarea, select, input {
        width: 100%;
        padding: 8px;
        margin-top: 5px;
        margin-bottom: 15px;
        font-family: monospace;
    }
    button {
        padding: 10px 20px;
        font-size: 16px;
        cursor: pointer;
    }
    .container {
        background: white;
        padding: 20px;
        border-radius: 8px;
        max-width: 900px;
        margin: auto;
    }
    #output {
        background: #111;
        color: #0f0;
        padding: 15px;
        white-space: pre-wrap;
    }
    .api-key-section {
        background: #fff8e1;
        border: 1px solid #f0c040;
        border-radius: 6px;
        padding: 12px 16px;
        margin-bottom: 20px;
    }
    .api-key-section label {
        font-weight: bold;
    }
    .api-key-note {
        font-size: 12px;
        color: #888;
        margin-top: 4px;
    }
</style>
</head>
<body>

<div class="container">
    <h1>SQL Generator</h1>

    <div class="api-key-section">
        <label>OpenAI API Key</label>
        <input type="password" id="apiKey" placeholder="Paste your sk-... key here">
        <div class="api-key-note">Your key is used only in this browser session and is never saved or sent anywhere except OpenAI.</div>
    </div>

    <h2>1. Database Setup</h2>
    <label>RDBMS</label>
    <select id="rdbms">
        <option>Oracle</option>
        <option>SQLite</option>
        <option>PostgreSQL</option>
        <option>MySQL</option>
        <option>SQL Server</option>
    </select>

    <label>Default Schema (optional)</label>
    <input type="text" id="schema" placeholder="e.g., public, dbo">

    <label>Case Sensitive Identifiers</label>
    <select id="caseSensitive">
        <option>No</option>
        <option>Yes</option>
    </select>

    <h2>2. Schema Definition</h2>
    <label>Tables & Columns</label>
    <textarea id="tables" rows="6" placeholder="Example:
employees(id INT, name VARCHAR, salary NUMBER, department_id INT)
departments(id INT, name VARCHAR)"></textarea>

    <label>Relationships (Foreign Keys)</label>
    <textarea id="relationships" rows="3" placeholder="employees.department_id = departments.id"></textarea>

    <h2>3. Rules & Constraints</h2>
    <label>SQL Constraints</label>
    <textarea id="constraints" rows="3" placeholder="e.g., Use ANSI joins only"></textarea>

    <h2>4. Natural Language Query</h2>
    <textarea id="nlQuery" rows="4" placeholder="e.g., Show top 5 highest paid employees per department"></textarea>

    <button onclick="generateSQL()">Generate SQL</button>

    <h2>Generated SQL</h2>
    <div id="output">-- SQL will appear here --</div>
</div>

<script>
async function generateSQL() {
    const rdbms = document.getElementById("rdbms").value;
    const schema = document.getElementById("schema").value;
    const caseSensitive = document.getElementById("caseSensitive").value;
    const tables = document.getElementById("tables").value;
    const relationships = document.getElementById("relationships").value;
    const constraints = document.getElementById("constraints").value;
    const apiKey = document.getElementById("apiKey").value.trim();
    const nlQuery = document.getElementById("nlQuery").value;

    if (!apiKey) {
        document.getElementById("output").textContent = "Error: Please paste your OpenAI API key at the top of the page.";
        return;
    }

    const systemPrompt = `
You are an expert SQL generator.

Rules:
- Output ONLY SQL
- Use ${rdbms} syntax
- Use ONLY provided schema
- Do not guess missing info
- If missing info, return an error message

Context:
Schema: ${tables}
Relationships: ${relationships}
Constraints: ${constraints}
Default Schema: ${schema}
Case Sensitive: ${caseSensitive}
`;

    const userPrompt = nlQuery;

    document.getElementById("output").textContent = "Generating...";

    try {
        const response = await fetch("https://api.openai.com/v1/chat/completions", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "Authorization": "Bearer " + apiKey
            },
            body: JSON.stringify({
                model: "gpt-4o-mini",
                messages: [
                    { role: "system", content: systemPrompt },
                    { role: "user", content: userPrompt }
                ],
                temperature: 0
            })
        });

        const data = await response.json();
        const sql = data.choices?.[0]?.message?.content || "Error generating SQL";

        document.getElementById("output").textContent = sql;

    } catch (err) {
        document.getElementById("output").textContent = "Error: " + err.message;
    }
}
</script>

</body>
</html>

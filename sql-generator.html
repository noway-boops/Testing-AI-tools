<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Natural Language to SQL Generator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
    /* ── Light mode (default) ── */
    :root {
        --bg:             #f9fafb;
        --container-bg:   #ffffff;
        --text-primary:   #111827;
        --text-secondary: #6b7280;
        --accent:         #3b82f6;
        --accent-hover:   #2563eb;
        --input-bg:       #f3f4f6;
        --input-border:   #d1d5db;
        --badge-bg:       #e0f2fe;
        --badge-text:     #1d4ed8;
        --divider:        #e5e7eb;
        --output-bg:      #1e293b;
        --output-text:    #22c55e;
    }

    /* ── Dark mode — built from Pantone 17-3932 (#6878B0 periwinkle) ── */
    [data-theme="dark"] {
        --bg:             #6878B0;
        --container-bg:   #2E4070;
        --text-primary:   #EEF2FF;
        --text-secondary: #A8BDE0;
        --accent:         #93C5FD;
        --accent-hover:   #60A5FA;
        --input-bg:       #1E2E55;
        --input-border:   #405080;
        --badge-bg:       #1E2E55;
        --badge-text:     #BDD5FF;
        --divider:        #405080;
        --output-bg:      #111E3C;
        --output-text:    #22c55e;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
        font-family: "Inter", system-ui, -apple-system, sans-serif;
        font-size: 14px;
        line-height: 1.6;
        letter-spacing: 0.2px;
        background: var(--bg);
        color: var(--text-primary);
        padding: 24px 20px;
        transition: background 0.2s, color 0.2s;
    }

    .container {
        background: var(--container-bg);
        padding: 24px;
        border-radius: 12px;
        width: 880px;
        max-width: 1000px;
        margin: auto;
    }

    /* ── Header ── */
    .page-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 24px;
    }

    h1 {
        font-size: 28px;
        font-weight: 600;
        letter-spacing: 0.3px;
    }

    .theme-toggle {
        background: var(--badge-bg);
        border: 1px solid var(--input-border);
        color: var(--text-secondary);
        padding: 6px 14px;
        border-radius: 999px;
        cursor: pointer;
        font-size: 13px;
        font-family: inherit;
        transition: color 0.15s;
    }
    .theme-toggle:hover { color: var(--text-primary); }

    /* ── API key + config box ── */
    .api-key-section {
        background: rgba(59,130,246,0.07);
        border: 1px solid rgba(59,130,246,0.3);
        border-radius: 8px;
        padding: 14px 16px;
        margin-bottom: 28px;
    }
    .api-key-section > label {
        font-weight: 600;
        font-size: 13px;
        color: var(--badge-text);
        margin-bottom: 6px;
    }
    .api-key-row {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 12px;
        align-items: end;
    }
    .api-key-row .field { display: flex; flex-direction: column; }
    .api-key-note {
        font-size: 12px;
        color: var(--text-secondary);
        margin-top: 4px;
        margin-bottom: 0;
    }

    /* ── Divider ── */
    .divider {
        border: none;
        border-top: 1px solid var(--divider);
        margin: 20px 0;
    }

    /* ── Section header (collapsible) ── */
    .section-header {
        display: flex;
        align-items: center;
        gap: 10px;
        cursor: pointer;
        user-select: none;
        margin-bottom: 14px;
    }
    .section-header h2 {
        font-size: 18px;
        font-weight: 600;
        letter-spacing: 0.3px;
    }
    .badge {
        background: var(--badge-bg);
        color: var(--badge-text);
        font-size: 12px;
        font-weight: 600;
        padding: 2px 10px;
        border-radius: 999px;
    }
    .collapse-arrow {
        margin-left: auto;
        color: var(--text-secondary);
        font-size: 12px;
        transition: transform 0.2s;
    }

    /* ── Section body ── */
    .section-body {
        overflow: hidden;
        transition: max-height 0.3s ease, opacity 0.2s ease;
    }
    .section-body.expanded  { max-height: 2000px; opacity: 1; }
    .section-body.collapsed { max-height: 0;      opacity: 0; }

    /* ── Labels ── */
    label {
        display: block;
        font-size: 13px;
        font-weight: 500;
        color: var(--text-secondary);
        margin-top: 10px;
        margin-bottom: 4px;
    }

    /* ── Inputs ── */
    textarea,
    select,
    input[type="text"],
    input[type="password"] {
        width: 100%;
        padding: 9px 12px;
        margin-bottom: 12px;
        font-size: 14px;
        font-family: "Inter", system-ui, sans-serif;
        background: var(--input-bg);
        color: var(--text-primary);
        border: 1px solid var(--input-border);
        border-radius: 8px;
        outline: none;
        transition: border-color 0.15s, box-shadow 0.15s;
    }
    input[type="text"],
    input[type="password"] {
        -webkit-appearance: none;
        appearance: none;
    }
    textarea {
        font-family: "JetBrains Mono", monospace;
        font-size: 13px;
        resize: vertical;
    }
    textarea::placeholder,
    input::placeholder { color: #6b7280; }
    textarea:focus,
    select:focus,
    input:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 2px rgba(59,130,246,0.25);
    }
    select {
        cursor: pointer;
        padding-right: 36px;
    }
    select:hover {
        border-color: var(--accent);
        background-color: var(--input-bg);
        filter: brightness(0.96);
    }

    /* ── Select wrapper arrow ── */
    .select-wrapper {
        position: relative;
        display: block;
        margin-bottom: 12px;
    }
    .select-wrapper select {
        margin-bottom: 0;
        width: 100%;
    }
    .select-wrapper::after {
        content: '▾';
        position: absolute;
        right: 12px;
        top: 50%;
        transform: translateY(-50%);
        color: var(--accent);
        font-size: 18px;
        pointer-events: none;
    }

    /* ── Generate button ── */
    .generate-btn {
        width: 100%;
        padding: 12px 16px;
        font-size: 15px;
        font-weight: 600;
        font-family: "Inter", system-ui, sans-serif;
        background: var(--accent);
        color: #fff;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        transition: background 0.15s;
        margin-top: 4px;
    }
    .generate-btn:hover    { background: var(--accent-hover); }
    .generate-btn:disabled { opacity: 0.7; cursor: not-allowed; }

    /* ── Spinner ── */
    .spinner {
        width: 16px;
        height: 16px;
        border: 2px solid rgba(255,255,255,0.3);
        border-top-color: #93c5fd;
        border-radius: 50%;
        animation: spin 0.7s linear infinite;
        display: none;
        flex-shrink: 0;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Output ── */
    .output-wrapper { position: relative; margin-top: 4px; }

    #output {
        background: var(--output-bg);
        color: var(--output-text);
        padding: 16px;
        padding-right: 72px;
        border-radius: 10px;
        font-family: "JetBrains Mono", monospace;
        font-size: 13.5px;
        white-space: pre-wrap;
        min-height: 60px;
        line-height: 1.7;
        border: 1px solid var(--divider);
    }

    /* ── SQL syntax colours ── */
    .sql-keyword { color: #60a5fa; font-weight: 600; }
    .sql-string  { color: #34d399; }
    .sql-number  { color: #f87171; }

    /* ── Copy button ── */
    .copy-btn {
        position: absolute;
        top: 10px;
        right: 10px;
        background: transparent;
        border: 1px solid #374151;
        color: #9ca3af;
        font-size: 12px;
        font-family: "Inter", sans-serif;
        padding: 4px 10px;
        border-radius: 6px;
        cursor: pointer;
        transition: color 0.15s, border-color 0.15s;
    }
    .copy-btn:hover { color: #e5e7eb; border-color: #6b7280; }
</style>
</head>
<body>

<div class="container">

    <div class="page-header">
        <h1>SQL Generator</h1>
        <button class="theme-toggle" id="themeBtn" onclick="toggleTheme()">🌙 Dark Mode</button>
    </div>

    <!-- API Key + Model -->
    <div class="api-key-section">
        <label>🔑 API Configuration</label>
        <div class="api-key-row">
            <div class="field">
                <label>OpenAI API Key</label>
                <input type="password" id="apiKey" placeholder="Paste your sk-... key here">
            </div>
            <div class="field">
                <label>Model</label>
                <div class="select-wrapper">
                    <select id="model">
                        <option value="gpt-4o-mini">gpt-4o-mini — fast &amp; cheap</option>
                        <option value="gpt-4o">gpt-4o — most capable</option>
                        <option value="gpt-4-turbo">gpt-4-turbo — powerful</option>
                        <option value="gpt-3.5-turbo">gpt-3.5-turbo — legacy</option>
                    </select>
                </div>
            </div>
        </div>
        <div class="api-key-note">Used only in this browser session — never saved or sent anywhere except OpenAI.</div>
    </div>

    <hr class="divider">

    <!-- 1 · Database Setup (collapsed by default) -->
    <div class="section-header" onclick="toggleSection('db-setup')">
        <span class="badge">1</span>
        <span>🗄️</span>
        <h2>Database Setup</h2>
        <span class="collapse-arrow" id="arrow-db-setup" style="transform:rotate(-90deg)">▼</span>
    </div>
    <div class="section-body collapsed" id="db-setup">
        <label>RDBMS</label>
        <div class="select-wrapper">
            <select id="rdbms">
                <option>Oracle</option>
                <option>SQLite</option>
                <option>PostgreSQL</option>
                <option>MySQL</option>
                <option>SQL Server</option>
            </select>
        </div>
        <label>Default Schema (optional)</label>
        <input type="text" id="schema" placeholder="e.g., public, dbo">
        <label>Case Sensitive Identifiers</label>
        <div class="select-wrapper">
            <select id="caseSensitive">
                <option>No</option>
                <option>Yes</option>
            </select>
        </div>
    </div>

    <hr class="divider">

    <!-- 2 · Schema Definition (collapsed by default) -->
    <div class="section-header" onclick="toggleSection('schema-def')">
        <span class="badge">2</span>
        <span>🧱</span>
        <h2>Schema Definition</h2>
        <span class="collapse-arrow" id="arrow-schema-def" style="transform:rotate(-90deg)">▼</span>
    </div>
    <div class="section-body collapsed" id="schema-def">
        <label>Tables &amp; Columns</label>
        <textarea id="tables" rows="5" placeholder="Example:
employees(id INT, name VARCHAR, salary NUMBER, department_id INT)
departments(id INT, name VARCHAR)"></textarea>
        <label>Relationships (Foreign Keys)</label>
        <textarea id="relationships" rows="3" placeholder="employees.department_id = departments.id"></textarea>
    </div>

    <hr class="divider">

    <!-- 3 · Rules & Constraints (collapsed by default) -->
    <div class="section-header" onclick="toggleSection('rules')">
        <span class="badge">3</span>
        <span>⚙️</span>
        <h2>Rules &amp; Constraints</h2>
        <span class="collapse-arrow" id="arrow-rules" style="transform:rotate(-90deg)">▼</span>
    </div>
    <div class="section-body collapsed" id="rules">
        <label>SQL Constraints</label>
        <textarea id="constraints" rows="3" placeholder="e.g., Use ANSI joins only"></textarea>
    </div>

    <hr class="divider">

    <!-- 4 · Query (expanded by default) -->
    <div class="section-header" onclick="toggleSection('query')">
        <span class="badge">4</span>
        <span>💬</span>
        <h2>Natural Language Query</h2>
        <span class="collapse-arrow" id="arrow-query">▼</span>
    </div>
    <div class="section-body expanded" id="query">
        <label>Your question</label>
        <textarea id="nlQuery" rows="4" placeholder="e.g., Show top 5 highest paid employees per department"></textarea>
        <button class="generate-btn" id="generateBtn" onclick="generateSQL()">
            <div class="spinner" id="spinner"></div>
            <span id="btnText">Generate SQL</span>
        </button>
    </div>

    <hr class="divider">

    <!-- 5 · Output (expanded by default) -->
    <div class="section-header" onclick="toggleSection('output-section')">
        <span class="badge">5</span>
        <span>🧾</span>
        <h2>Generated SQL</h2>
        <span class="collapse-arrow" id="arrow-output-section">▼</span>
    </div>
    <div class="section-body expanded" id="output-section">
        <div class="output-wrapper">
            <div id="output">-- SQL will appear here --</div>
            <button class="copy-btn" onclick="copySQL()">Copy</button>
        </div>
    </div>

</div>

<script>
function toggleTheme() {
    const html = document.documentElement;
    const btn  = document.getElementById('themeBtn');
    if (html.dataset.theme === 'dark') {
        html.removeAttribute('data-theme');
        btn.textContent = '🌙 Dark Mode';
    } else {
        html.dataset.theme = 'dark';
        btn.textContent = '☀️ Light Mode';
    }
}

function toggleSection(id) {
    const body  = document.getElementById(id);
    const arrow = document.getElementById('arrow-' + id);
    if (body.classList.contains('collapsed')) {
        body.classList.replace('collapsed', 'expanded');
        arrow.style.transform = 'rotate(0deg)';
    } else {
        body.classList.replace('expanded', 'collapsed');
        arrow.style.transform = 'rotate(-90deg)';
    }
}

function highlightSQL(sql) {
    const keywords = [
        'SELECT','FROM','WHERE','JOIN','LEFT','RIGHT','INNER','OUTER','CROSS','ON',
        'AND','OR','NOT','IN','IS','NULL','ORDER','BY','GROUP','HAVING','LIMIT',
        'OFFSET','INSERT','UPDATE','DELETE','CREATE','DROP','ALTER','TABLE','INDEX',
        'DISTINCT','AS','CASE','WHEN','THEN','ELSE','END','UNION','ALL','WITH',
        'FETCH','FIRST','ROWS','ONLY','TOP','DESC','ASC','COUNT','SUM','AVG',
        'MIN','MAX','INTO','VALUES','SET','OVER','PARTITION','ROW_NUMBER','RANK'
    ];

    const escaped = sql
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');

    // Split on quoted strings (single or double) so keywords are never
    // highlighted inside alias names or string values
    const parts = escaped.split(/((?:'[^']*')|(?:"[^"]*"))/g);

    return parts.map((part, i) => {
        if (i % 2 === 1) {
            return `<span class="sql-string">${part}</span>`;
        }
        let out = part.replace(/\b(\d+)\b/g, '<span class="sql-number">$1</span>');
        keywords.forEach(kw => {
            out = out.replace(new RegExp('\\b' + kw + '\\b', 'gi'),
                m => `<span class="sql-keyword">${m.toUpperCase()}</span>`);
        });
        return out;
    }).join('');
}

async function copySQL() {
    const text = document.getElementById('output').innerText;
    if (text === '-- SQL will appear here --') return;
    await navigator.clipboard.writeText(text);
    const btn = document.querySelector('.copy-btn');
    btn.textContent = 'Copied!';
    setTimeout(() => btn.textContent = 'Copy', 1500);
}

async function generateSQL() {
    const apiKey        = document.getElementById('apiKey').value.trim();
    const model         = document.getElementById('model').value;
    const rdbms         = document.getElementById('rdbms').value;
    const schema        = document.getElementById('schema').value;
    const caseSensitive = document.getElementById('caseSensitive').value;
    const tables        = document.getElementById('tables').value;
    const relationships = document.getElementById('relationships').value;
    const constraints   = document.getElementById('constraints').value;
    const nlQuery       = document.getElementById('nlQuery').value;

    if (!apiKey) {
        document.getElementById('output').innerHTML =
            '<span style="color:#f87171">Error: Please paste your OpenAI API key at the top of the page.</span>';
        return;
    }

    const systemPrompt = `You are an expert SQL generator.

Rules:
- Output ONLY SQL
- Use ${rdbms} syntax
- Use ONLY provided schema
- Do not guess missing info
- If missing info, return an error message

Formatting:
- Each major clause (SELECT, FROM, WHERE, JOIN, GROUP BY, ORDER BY, HAVING) on its own line
- Each selected column on its own line, indented 4 spaces
- JOIN conditions indented 4 spaces under the JOIN line
- WHERE and HAVING conditions indented 4 spaces

Context:
Schema: ${tables}
Relationships: ${relationships}
Constraints: ${constraints}
Default Schema: ${schema}
Case Sensitive: ${caseSensitive}`;

    const btn     = document.getElementById('generateBtn');
    const spinner = document.getElementById('spinner');
    const btnText = document.getElementById('btnText');

    btn.disabled = true;
    spinner.style.display = 'block';
    btnText.textContent = 'Generating...';
    document.getElementById('output').innerHTML = '<span style="color:#6b7280">Generating...</span>';

    const outputBody = document.getElementById('output-section');
    if (outputBody.classList.contains('collapsed')) toggleSection('output-section');

    try {
        const response = await fetch('https://api.openai.com/v1/chat/completions', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': 'Bearer ' + apiKey
            },
            body: JSON.stringify({
                model: model,
                messages: [
                    { role: 'system', content: systemPrompt },
                    { role: 'user',   content: nlQuery }
                ],
                temperature: 0
            })
        });

        const data  = await response.json();
        const sql   = data.choices?.[0]?.message?.content || 'Error generating SQL';
        const clean = sql.replace(/^```sql\n?/i,'').replace(/^```\n?/,'').replace(/```$/,'').trim();
        document.getElementById('output').innerHTML = highlightSQL(clean);

    } catch (err) {
        document.getElementById('output').innerHTML =
            '<span style="color:#f87171">Error: ' + err.message + '</span>';
    } finally {
        btn.disabled = false;
        spinner.style.display = 'none';
        btnText.textContent = 'Generate SQL';
    }
}
</script>
</body>
</html>
